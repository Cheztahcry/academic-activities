<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
  <div class="input-group search-box mb-4 mx-auto">
    <input type="text" id="gameQuery" class="form-control text-light" placeholder="Search a game (e.g., Portal, Witcher)">
    <button id="steam-search-btn" class="btn text-white fw-bold" type="button">Search</button>
  </div>
  <div id="results" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 justify-content-center">
    <div class="col">
      <div class="steam-card-vertical h-100 d-flex flex-column">
        
        <div class="card-img-wrapper">
          <a href="https://store.steampowered.com/app/207730" 
            class="btn btn-primary fw-bold" 
            target="_blank" 
            rel="noopener noreferrer">
            View on Steam
          </a>
            <i class="bi bi-plus-lg"></i>
          </button>
          <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/620/header.jpg" alt="Portal 2">
        </div>

        <div class="p-3 d-flex flex-column flex-grow-1 justify-content-between">
          <div>
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h3 class="h6 mb-0 fw-bold">
                <a href="https://store.steampowered.com/app/620" target="_blank" rel="noopener noreferrer" class="steam-title-link">Portal 2</a>
              </h3>
            </div>
          </div>

          <div>
            <div class="d-flex align-items-center justify-content-between pt-2 border-top border-secondary border-opacity-25">
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-windows platform-icon" title="Windows"></i>
                <i class="bi bi-apple platform-icon" title="macOS"></i>
                <span class="deck-badge" title="Steam Deck Verified">
                  <i class="bi bi-check-circle-fill"></i> <i class="bi bi-controller"></i>
                </span>
              </div>

              <div class="steam-price-block">
                <div class="steam-price-details">
                  <span class="steam-final-price">$0.99</span>
                </div>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
  <script src="js/index.js"></script>
</body>
</html>
