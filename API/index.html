<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke - Steam Game Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
</head>
<body class="steam-bg text-light min-vh-100">

<div class="container py-5">
  
  <!-- Header / Navigation Toggle -->
  <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-steam fs-2 text-info"></i>
      <h1 class="h4 mb-0 fw-bold tracking-wide">SMOKE</h1>
    </div>
  </div>

  <!-- Search Bar Section -->
  <div id="search-pane">
    <div class="search-box mb-4 mx-auto" style="max-width: 600px;">
      <div class="input-group input-group-lg border border-secondary border-opacity-50 rounded-3 overflow-hidden shadow-lg">
        <span class="input-group-text bg-dark border-0 text-secondary"><i class="bi bi-search"></i></span>
        <input type="text" id="gameQuery" class="form-control bg-dark text-light border-0 fs-6 shadow-none" placeholder="Search a game (e.g., Portal, Witcher, Cyberpunk)...">
        <button id="steam-search-btn" class="btn btn-info fw-bold px-4 text-dark" type="button">Search</button>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="results" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 justify-content-center">
      <!-- Search results generated dynamically by js/index.js -->
    </div>
  </div>

  <!-- Featured Deals Placeholder Pane -->
  <div id="deals-pane" class="d-none text-center py-5">
    <h2 class="h4 text-info fw-bold">🔥 Featured CheapShark Deals</h2>
    <p class="text-secondary">Special deals list rendering layout ready.</p>
  </div>

</div>

<!-- Modal Dialog for "More Info" -->
<div class="modal fade" id="gameInfoModal" tabindex="-1" aria-labelledby="gameInfoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark text-light border border-secondary shadow-lg">
      <div class="modal-header border-secondary border-opacity-50">
        <h5 class="modal-title fw-bold text-info" id="gameInfoModalLabel">
          <i class="bi bi-controller me-2"></i><span id="modalGameTitle">Game Title</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-body p-4">
        <div class="row g-4 align-items-center">
          <!-- Game Image -->
          <div class="col-md-5">
            <img id="modalGameImg" src="" alt="Game Banner" class="img-fluid rounded border border-secondary border-opacity-25 w-100 shadow">
          </div>

          <!-- Deal Metrics & Details Container -->
          <div class="col-md-7">
            <div class="p-3 bg-secondary bg-opacity-10 rounded border border-secondary border-opacity-25">
              
              <!-- Pricing & Savings Row -->
              <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary border-opacity-25">
                <span class="text-secondary small fw-bold text-uppercase">Deal Details</span>
                <div class="d-flex align-items-center gap-2">
                  <span id="modalGameNormalPrice" class="text-secondary text-decoration-line-through small"></span>
                  <span id="modalGamePrice" class="fs-4 fw-bold text-success"></span>
                  <span id="modalGameSavings" class="badge bg-success"></span>
                </div>
              </div>

              <!-- Structured Info List -->
              <div class="d-flex flex-column gap-2 small">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-secondary"><i class="bi bi-calendar-event me-2"></i>Release Date:</span>
                  <span id="modalGameReleaseDate" class="fw-semibold text-light">N/A</span>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-secondary"><i class="bi bi-award me-2"></i>Metacritic Score:</span>
                  <span id="modalGameMetacritic" class="fw-semibold text-warning">N/A</span>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-secondary"><i class="bi bi-display me-2"></i>Supported Platforms:</span>
                  <div class="d-flex align-items-center gap-2 text-light">
                    <i class="bi bi-windows" title="Windows"></i>
                    <i class="bi bi-apple" title="macOS"></i>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer border-secondary border-opacity-50 justify-content-between">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        <a id="modalSteamBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-primary fw-bold px-4">
          <i class="bi bi-steam me-2"></i>Open on Steam Store
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/index.js"></script>
</body>
</html>
